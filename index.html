<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Barista Life — Coffee Shop Simulator</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#1d1713;color:#f3e7d3;font:15px/1.4 ui-monospace,"Courier New",monospace;overscroll-behavior:none}
#app{max-width:760px;margin:0 auto;height:100dvh;display:flex;flex-direction:column}
header{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:8px 10px;background:#2b2019;border-bottom:3px solid #000}
header h1{font-size:15px;margin:0}
.st{display:flex;gap:10px;font-weight:bold;color:#f0b24a}
svg{display:block;shape-rendering:crispEdges}
#sw{position:relative;width:min(100%,56dvh);margin:0 auto;flex:none;border-bottom:3px solid #000}
#sw svg{width:100%;height:auto}
[data-eq]{cursor:pointer}
.ol{display:none;fill:none;stroke:#f0b24a;stroke-width:1;stroke-dasharray:3 2;pointer-events:none}
.hl .ol{display:block}
#bub{position:absolute;right:20%;top:4%;max-width:48%;background:#f6ecd2;color:#1d1713;padding:5px 7px;font-size:12px;border:2px solid #000;border-radius:3px}
#home{position:absolute;right:4px;bottom:6px}
#pn{flex:1;overflow:auto;padding:10px;display:flex;flex-direction:column;gap:8px;padding-bottom:max(10px,env(safe-area-inset-bottom))}
h2{margin:0;font-size:16px;color:#f0b24a}
p{margin:0}
.b{width:100%;min-height:44px;padding:10px 12px;border:0;border-radius:4px;background:#f0b24a;color:#1d1713;font:bold 15px ui-monospace,"Courier New",monospace;box-shadow:0 3px 0 #8a5f1e;touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;cursor:pointer}
.b.s{background:#4b3a2d;color:#f3e7d3;box-shadow:0 3px 0 #000}
.b.sm{width:auto;min-height:36px;padding:6px 10px;font-size:13px}
.b:active{transform:translateY(2px)}
.b:disabled{opacity:.4;cursor:default}
.b:focus-visible,input:focus-visible{outline:3px solid #fff}
.lcd{background:#0d2b14;color:#8be08b;border:3px solid #000;padding:4px 10px;font-size:26px;text-align:right;letter-spacing:2px}
input[type=range]{width:100%;height:34px;accent-color:#f0b24a}
.row{display:flex;justify-content:space-between;gap:8px;border-bottom:1px dashed #5a4636;padding:3px 0}
.stars{font-size:28px;color:#f0b24a}
#bw{position:fixed;inset:0;background:#1d1713;display:flex;flex-direction:column;z-index:9;max-width:760px;margin:0 auto}
.hid{display:none!important}
.bar{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;padding-top:max(8px,env(safe-area-inset-top))}
#bs{flex:1 1 0;min-height:0;width:100%;touch-action:none;cursor:grab}
#stg{padding:4px 10px;font-size:13px;min-height:58px}
.chip{display:inline-block;padding:2px 8px;margin:0 4px 4px 0;border:2px solid #5a4636}
.chip.cur{border-color:#f0b24a;color:#f0b24a}.chip.done{background:#2e5a37;border-color:#2e5a37}
.ctl{padding:6px 10px max(10px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:6px;background:#2b2019;border-top:3px solid #000}
.r3{display:flex;gap:6px}.r3 .b{width:auto;flex:1}
.trk{display:flex;gap:4px}.trk i{flex:1;height:6px;background:#4b3a2d}.trk i.on{background:#f0b24a}.trk i.cur{background:#fff}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.card{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px;text-align:center}.card svg{shape-rendering:crispEdges}.card small{font-size:11px;font-weight:normal}
.two{display:flex;gap:6px}.two .b{flex:1}
.rg{display:flex;align-items:center;gap:8px;font-size:12px}.rg input{flex:1}
.gg{position:relative;height:14px;background:#1d1713;border:2px solid #000}.gg i{display:block;height:100%;background:#f0b24a}.gg b{position:absolute;left:50%;top:-2px;bottom:-2px;width:2px;background:#fff}
/* Animasi tenang (mati otomatis jika pengguna memilih mengurangi gerakan) */
@media (prefers-reduced-motion:no-preference){
 .hl .ol{animation:bl 1s steps(2) infinite}@keyframes bl{50%{opacity:.3}}
 .stm rect{opacity:0;animation:up 3.2s linear infinite}
 .stm rect:nth-child(2){animation-delay:1.1s}.stm rect:nth-child(3){animation-delay:2.1s}
 @keyframes up{0%{opacity:0;transform:translateY(0)}25%{opacity:.55}100%{opacity:0;transform:translateY(-9px)}}
 .lg{animation:fl 4.5s ease-in-out infinite}.beam{animation:fl 7s ease-in-out infinite}
 @keyframes fl{50%{opacity:.6}}
 .sway{transform-box:fill-box;transform-origin:50% 100%;animation:sw 5s ease-in-out infinite}
 @keyframes sw{50%{transform:rotate(2.5deg)}}
 .bob{animation:bob 3.2s steps(2,jump-none) infinite}@keyframes bob{50%{transform:translateY(.6px)}}
}
</style>
</head>
<body>
<div id="app">
 <header><h1>Barista Life</h1><div class="st"><span id="money"></span><span id="rep"></span></div><button class="b s sm" onclick="restart()">↻ Mulai ulang</button></header>
 <div id="sw">
  <svg id="scn" viewBox="0 0 160 100" role="img" aria-label="Kedai kopi dilihat dari belakang meja barista"></svg>
  <div id="bub" style="display:none"></div>
  <button id="home" class="b s sm" style="display:none" onclick="peek=null;home=true">Lihat kedai</button>
 </div>
 <div id="pn"></div>
</div>

<div id="bw" class="hid">
 <div class="bar"><button class="b s sm" onclick="closeBrew()">← Kembali ke kedai</button><div class="lcd" id="tm">0:00</div></div>
 <svg id="bs" viewBox="0 0 160 130" role="img" aria-label="Meja seduh dilihat dari atas"></svg>
 <div id="stg"></div>
 <div class="ctl">
  <label>Aliran air: <b id="fv">5.0</b> g/detik <input type="range" id="fl" min="1" max="12" step=".5" value="5" oninput="B.flow=+this.value;$('fv').textContent=B.flow.toFixed(1)"></label>
  <button id="pb" class="b" onclick="togglePour()">Mulai tuang</button>
  <div class="r3"><button class="b s sm" onclick="centerK()">Pusatkan teko</button><button class="b s sm" onclick="again()">Ulang seduh</button><button id="fin" class="b sm" onclick="finishBrew()" disabled>Selesai seduh</button></div>
 </div>
</div>

<script>
// ===== Bantuan kecil =====
const $=id=>document.getElementById(id);
const cl=(v,a=0,b=100)=>Math.max(a,Math.min(b,v));
const fmt=t=>Math.floor(t/60)+':'+String(Math.floor(t%60)).padStart(2,'0');

// ===== Pixel art: sprite digambar dari teks (satu huruf = satu piksel warna) =====
const PAL={k:'#1a110c',d:'#3b2416',b:'#6b4328',m:'#8f5e36',l:'#b98652',c:'#e8d3a8',w:'#f6ecd2',g:'#2f4a3a',G:'#4f7a55',h:'#7fa56a',a:'#f0b24a',A:'#ffd98a',s:'#8b949c',S:'#c3cad0',t:'#596068',r:'#a8452f',n:'#4a2c1a',e:'#bcd9d6',E:'#f4fffd',o:'#e0b48a',p:'#d98a6c'};
function spr(rows,x,y){let o='';rows.forEach((r,j)=>{let i=0;while(i<r.length){const c=r[i];if(c==='.'||!PAL[c]){i++;continue}let k=i;while(k<r.length&&r[k]===c)k++;o+=`<rect x="${x+i}" y="${y+j}" width="${k-i}" height="1" fill="${PAL[c]}"/>`;i=k}});return o}
const rnd=seed=>()=>(seed=(seed*16807)%2147483647)/2147483647;
const R_=(x,y,w,h,f,op)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${f}"${op?` opacity="${op}"`:''}/>`;
const OO='k'+'o'.repeat(12)+'k';
const HEAD=['..kkkkkkkkkk..','.kddddddddddk.','kddbddddddbddk','k'+'d'.repeat(12)+'k','kdooddddddoodk','kd'+'o'.repeat(10)+'dk',OO,OO,OO,OO,OO,'.k'+'o'.repeat(10)+'k.','..k'+'o'.repeat(8)+'k..','...'+'k'.repeat(8)+'...'];
const JAR=['..kkkkkk..','.kmmmmmmk.','.kddddddk.','kEeeeeeeek','kEeeeeeeek','kEeennneek','kEnnnnnnek','kEnbnnnbnk','kEnnnnnnnk','kEnnbnnnnk','kEnnnnnbnk','kEnnnnnnnk','kddddddddk','.kkkkkkkk.'];
const GRI=['...kkkkkkkk...','..kEeeeeeeek..','..kEennnnnek..','..kEnnbnnnek..','...kEnnnnek...','...kkkkkkkk...','..kttttttttk..','.kSsssssssstk.','.kSsttttttstk.','.kSsttaAAastk.','.kSsttaaaastk.','.kSsttttttstk.','.kSsssssssstk.','.kSsssssssstk.','.kttttttttttk.','.....kttk.....','.....kttk.....','..kkkkkkkkkk..','.kddddddddddk.','.kkkkkkkkkkkk.'];
const PLANT=['..h...h..','.hGh.hGh.','hGGGhGGGh','.hGGGGGh.','..hGGGh..','...kmk...','..kmmmk..','..kbbbk..','...kkk...'];
const BAG=['.kkkk.','kddddk','kcccck','kcrrck','kcrrck','kcccck','kddddk','.kkkk.'];
const CUP=['kwwwwwk','kwwwwwk','kcwwwck','.kcccck','..kkkk.'];

// ===== Kamera hybrid: [x, y, lebar, tinggi] di dalam koordinat kedai 160x100 =====
// Semua preset berasio 1.6 agar bentuk tampilan tidak berubah. Tambah preset baru di sini.
const CAMS={shop:[0,0,160,100],jar:[0,30,64,40],gri:[8,24,64,40],wei:[22,22,80,50],drp:[44,24,64,40],ket:[78,26,64,40]};
const CAMP={bean:'jar',grind:'gri',weigh:'wei',prep:'drp',temp:'ket'};   // kamera otomatis per langkah
let cam=CAMS.shop.slice(),peek=null,home=false,bubTxt='';
const reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion:reduce)').matches;
const camName=()=>peek||(home?'shop':CAMP[S.ph])||'shop';
function sceneLoop(ts){
 const dt=cl((ts-tPrev)/1000,0,.1);tPrev=ts;
 const n=camName(),t=CAMS[n],k=reduce?1:.12;
 for(let i=0;i<4;i++)cam[i]+=(t[i]-cam[i])*k;
 $('scn').setAttribute('viewBox',cam.map(v=>v.toFixed(2)).join(' '));
 if(!view){custFrame(dt);grindFx(dt)}
 const sb=(S.ph==='order'&&cs==='wait')||(S.ph==='served'&&cs==='sip'&&csT>1.2);
 $('bub').style.display=(n==='shop'&&bubTxt&&sb)?'':'none';
 $('home').style.display=n==='shop'?'none':'';
 requestAnimationFrame(sceneLoop);
}
// Ketuk peralatan = zoom; ketuk lagi = kembali; ketuk bagian lain = lihat seluruh kedai
$('scn').onclick=e=>{const g=e.target.closest&&e.target.closest('[data-eq]');
 if(g){const n=g.getAttribute('data-eq');peek=camName()===n?null:n;home=false}else{peek=null;home=true}};

function buildScene(){
 const r=R_,R=rnd(7);let o='';
 o+=`<defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e9a45a"/><stop offset=".55" stop-color="#d98a6c"/><stop offset="1" stop-color="#5b7f86"/></linearGradient><radialGradient id="lg"><stop offset="0" stop-color="#ffd98a" stop-opacity=".5"/><stop offset="1" stop-color="#ffd98a" stop-opacity="0"/></radialGradient><radialGradient id="vg" cx=".5" cy=".5" r=".75"><stop offset=".55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#120a06" stop-opacity=".55"/></radialGradient></defs>`;
 // dinding plester + tekstur
 o+=r(0,0,160,62,'#5a4a38');
 for(let i=0;i<90;i++)o+=r(R()*158|0,R()*32|0,1+(R()*2|0),1,R()<.5?'#4c3d2e':'#6a5842');
 // lambris kayu hijau gelap + rel
 o+=r(0,34,160,28,'#2f4a3a');
 for(let x=0;x<160;x+=8)o+=r(x,36,1,26,'#243a2d')+r(x+1,36,1,26,'#3b5c47');
 o+=r(0,33,160,2,'#b98652')+r(0,33,160,1,'#e8d3a8')+r(0,35,160,1,'#3b2416');
 // jendela senja
 o+=r(58,6,40,24,'#3b2416')+r(60,8,36,20,'url(#sky)')+r(68,19,10,3,'#ffd98a')+r(70,17,6,2,'#ffd98a','.8')+r(60,24,14,4,'#2f4a3a')+r(74,22,22,6,'#243a2d');
 o+=r(77,8,2,20,'#6b4328')+r(60,17,36,2,'#6b4328')+r(77,8,1,20,'#8f5e36')+r(56,30,44,3,'#b98652')+r(56,30,44,1,'#e8d3a8')+r(56,33,44,1,'#3b2416');
 o+=`<g class="sway">${spr(PLANT,61,21)}</g>`;
 // papan menu kapur
 o+=r(102,8,22,15,'#3b2416')+r(104,10,18,11,'#1f2a24')+r(105,12,9,1,'#f6ecd2')+r(105,15,13,1,'#f6ecd2','.8')+r(105,18,6,1,'#f6ecd2','.8')+r(116,17,4,3,'#f6ecd2','.7');
 // rak dengan kemasan kopi dan cangkir
 o+=r(4,14,32,2,'#b98652')+r(4,14,32,1,'#e8d3a8')+r(4,16,32,1,'#1a110c','.4');
 [6,14,22,29].forEach(x=>o+=spr(BAG,x,6));
 o+=r(4,22,24,2,'#b98652')+r(4,22,24,1,'#e8d3a8')+r(4,24,24,1,'#1a110c','.4');
 [6,14,21].forEach(x=>o+=spr(CUP,x,17));
 // lampu gantung + cahaya
 [46,140].forEach(cx=>{o+=`<circle class="lg" cx="${cx+.5}" cy="15" r="26" fill="url(#lg)" pointer-events="none"/>`+r(cx,0,1,8,'#1a110c')+r(cx-5,8,11,2,'#2f4a3a')+r(cx-7,10,15,2,'#2f4a3a')+r(cx-5,8,3,1,'#4f7a55')+r(cx-7,12,15,1,'#ffd98a')+r(cx-3,13,7,1,'#fff3c4')});
 // pelanggan (kepala dan badan terpisah agar animasi mudah ditambah)
  o+=`<g id="cus" style="display:none">${r(136,34,6,2,'#b98a62')}<g id="sh" fill="#3f6fb5"><rect x="128" y="35" width="22" height="26"/></g>`+r(128,35,2,26,'#000','.18')+r(148,35,2,26,'#000','.25')+r(135,35,8,2,'#f6ecd2','.7')+`<g id="c-head">${spr(HEAD,132,20)}<g id="eyes">`+r(136,28,2,2,'#1a110c')+r(141,28,2,2,'#1a110c')+r(136,28,1,1,'#fff')+r(141,28,1,1,'#fff')+`</g><g id="lids" style="display:none">`+r(136,29,2,1,'#3b2416')+r(141,29,2,1,'#3b2416')+`</g>`+r(134,31,2,1,'#d98a6c','.6')+r(144,31,2,1,'#d98a6c','.6')+`<g id="mo" fill="#3a1a1a"></g></g><g id="c-arm"><g id="sh2" fill="#3f6fb5"><rect x="125" y="38" width="4" height="14"/></g><rect x="125" y="52" width="4" height="4" fill="#e0b48a"/></g><g id="c-cup" style="display:none">${spr(CUP,0,0)}<g class="stm">${r(2,-3,1,2,'#f6ecd2')}${r(4,-3,1,2,'#f6ecd2')}${r(3,-3,1,2,'#f6ecd2')}</g></g></g>`;
 // meja kayu: permukaan, panel depan, serat
 o+=r(0,60,160,6,'#b98652')+r(0,60,160,1,'#e8d3a8')+r(0,65,160,1,'#8f5e36');
 for(let i=0;i<40;i++)o+=r(R()*156|0,61+(R()*3|0),2+(R()*4|0),1,'#8f5e36','.6');
 o+=r(0,66,160,34,'#6b4328');
 for(let x=0;x<160;x+=10)o+=r(x,66,1,34,'#3b2416','.55')+r(x+1,66,1,34,'#8f5e36','.7');
 for(let i=0;i<70;i++)o+=r(R()*156|0,68+(R()*30|0),2+(R()*4|0),1,R()<.5?'#5a3a22':'#7d5230');
 o+=r(0,66,160,2,'#1a110c','.4')+r(0,96,160,4,'#1a110c','.35');
 // peralatan (tiap grup bisa diketuk untuk zoom)
 o+=`<g id="g-jar" data-eq="jar">${r(4,60,13,1,'#1a110c','.35')}${spr(JAR,5,46)}<rect class="ol" x="3" y="44" width="14" height="17"/></g>`;
  o+=`<g id="g-gri" data-eq="gri">${r(29,60,17,1,'#1a110c','.35')}${r(30,48,2,12,'#6b4328')+r(42,48,2,12,'#6b4328')+r(30,48,1,12,'#b98652')+r(42,48,1,12,'#b98652')}<g id="gri-m">${spr(GRI,30,28)}<rect id="gdial" x="36" y="39" width="1" height="1" fill="#ffd98a"/><rect id="gled" x="41" y="36" width="1" height="1" fill="#3b2416"/></g>${r(32,58,10,2,'#3b3f45')+r(32,57,10,1,'#c3cad0')}<text id="mgl" x="37" y="59.4" font-size="2.2" fill="#8be08b" text-anchor="middle" font-family="monospace">0.0</text>${r(33,52,7,5,'#8b949c')+r(34,52,5,4,'#2b2420')+r(33,52,1,5,'#c3cad0')}<rect id="gnd" x="34" y="56" width="5" height="0" fill="#4a2c1a"/><g id="gpt" fill="#5a3320"></g><rect class="ol" x="28" y="26" width="18" height="35"/></g>`;
 o+=spr(CUP,47,55);
 o+=`<g id="g-scl" data-eq="wei">${r(56,57,38,4,'#3b3f45')+r(56,57,38,1,'#596068')+r(58,54,34,3,'#c3cad0')+r(58,54,34,1,'#fff','.6')+r(80,58,12,2,'#0d2b14')+r(82,58,8,1,'#8be08b')+r(55,61,40,1,'#1a110c','.35')}<rect class="ol" x="54" y="52" width="42" height="10"/></g>`;
 let cone='';for(let i=0;i<10;i++)cone+=r(63+i,32+i,24-2*i,1,i%3===2?'#d9c08f':'#e8d3a8')+r(63+i,32+i,1,1,'#1a110c')+r(86-i,32+i,1,1,'#1a110c')+r(64+i,32+i,1,1,'#fff')+r(85-i,32+i,1,1,'#b98652');
 o+=`<g id="g-drp" data-eq="drp">${r(65,43,20,11,'#bcd9d6','.55')}${r(66,50,18,4,'#4a2c1a')}${r(66,43,1,10,'#fff','.55')}${r(65,53,20,1,'#1a110c','.5')}${r(85,45,2,7,'#3b2416')}<g id="d-cone">${cone}${r(62,31,26,2,'#f6ecd2')}</g><g id="d-flt">${r(65,32,20,1,'#fff')+r(66,33,18,1,'#e8d3a8')}</g><g id="d-grd">${r(66,33,18,2,'#4a2c1a')}</g><rect class="ol" x="60" y="29" width="30" height="26"/></g>`;
 o+=`<g id="g-ket" data-eq="ket">${r(97,60,25,1,'#1a110c','.35')}${r(100,42,16,18,'#8b949c')}${r(101,43,2,16,'#c3cad0')}${r(114,43,2,16,'#596068')}${r(100,50,16,2,'#b98652')}${r(102,39,12,3,'#c3cad0')}${r(106,36,4,3,'#3b2416')}${r(116,42,5,2,'#3b2416')}${r(119,42,2,12,'#3b2416')}${r(116,52,5,2,'#3b2416')}${r(98,56,3,2,'#8b949c')}${r(96,50,3,7,'#8b949c')}${r(95,46,3,5,'#8b949c')}${r(93,44,4,3,'#8b949c')}${r(96,50,1,7,'#c3cad0')}<rect class="ol" x="91" y="34" width="32" height="27"/></g>`;
 o+=`<g class="stm" id="stmg" pointer-events="none">${r(93,41,2,2,'#f6ecd2')}${r(95,41,2,2,'#f6ecd2')}${r(92,41,2,2,'#f6ecd2')}</g>`;
 // sorot cahaya jendela dan vinyet
 o+=`<polygon class="beam" points="62,28 94,28 132,62 84,62" fill="#ffd98a" opacity=".1" pointer-events="none"/><rect width="160" height="100" fill="url(#vg)" pointer-events="none"/>`;
 $('scn').innerHTML=o;
}
const MOUTH=['<rect x="137" y="32" width="6" height="1"/>','<rect x="136" y="31" width="1" height="1"/><rect x="137" y="32" width="6" height="1"/><rect x="143" y="31" width="1" height="1"/>','<rect x="136" y="33" width="1" height="1"/><rect x="137" y="32" width="6" height="1"/><rect x="143" y="33" width="1" height="1"/>'];

// ===== Pelanggan hidup: out > enter > wait > take > sip > leave =====
let cs='out',csT=0,tPrev=0,lt=0,leaving=false,mCache=-1,gp=[],gAcc=0,gS='';
const setCs=x=>{cs=x;csT=0};
function custFrame(dt){
 csT+=dt;const c=$('cus');
 if(cs==='out'){c.style.display='none';return}
 c.style.display='';
 let ox=0,by=Math.round(Math.sin(csT*2)*.8),arm=0,cx=124,cy=53,cup=false,mo=0,gl=[0,1,0,-1][Math.floor(csT/1.7)%4],bl=Math.floor(csT*10)%37===0;

 case 'result':{const Rr=S.res;
  const rows=[['Rasio',`1:${Rr.ratio.toFixed(1)}`,Rr.sc.ratio],['Gilingan',S.grind,Rr.sc.grind],['Suhu',S.temp+'°C',Rr.sc.temp],['Waktu',fmt(Rr.total),Rr.sc.time],['Konsistensi','',Rr.sc.cons]];
  return `${hd}`+rows.map(x=>`<div class="row"><span>${x[0]}</span><span>${x[1]}</span><b>${Math.round(x[2])}</b></div>`).join('')+`<p>Rasa (simulasi): ${Rr.taste}</p><div class="lcd">Skor ${Math.round(Rr.score)}</div><button class="b" onclick="serve()">Sajikan kopi</button>`}
 case 'served':return `${hd}<div class="stars">${'★'.repeat(S.stars)}${'☆'.repeat(5-S.stars)}</div><p>Rp ${S.earn.toLocaleString('id-ID')} · Reputasi ${S.d>=0?'+':''}${S.d}</p><button class="b" onclick="nextC()">Pelanggan berikutnya</button>`;
 }
}

// ===== Tombol di panel =====
function holdOn(e){e.preventDefault();if(hold)return;hold=setInterval(()=>{S.grams=Math.min(30,S.grams+.25);updW()},80)}
function stopHold(){if(hold){clearInterval(hold);hold=null}}
function updW(){const l=$('lcd');if(!l)return;l.textContent=S.grams.toFixed(1)+' g';l.style.color=Math.abs(S.grams-15)<=.5?'#fff':'';const f=$('gf');if(f){f.style.width=cl(S.grams/30*100)+'%';f.style.background=Math.abs(S.grams-15)<=.5?'#8be08b':''}$('nx').disabled=S.grams<5}
document.oncontextmenu=e=>{if(e.target.closest&&e.target.closest('#gb'))e.preventDefault()};
function restart(){clearTimeout(lt);leaving=false;closeBrew();if(S.ph==='idle'||S.ph==='served'){setCs('out');newOrder();go('order')}else{const sh=S.shirt;newOrder();S.shirt=sh;go('bean')}}
function nextC(){if(leaving)return;leaving=true;setCs('leave');lt=setTimeout(()=>{leaving=false;newOrder();go('order')},850)}
function wipe(){if(confirm('Hapus uang dan reputasi yang tersimpan?')){save={money:0,rep:0,served:0};persist();render()}}

// ===== Tampilan seduh (dekat) =====
function openBrew(){view=true;pid=null;$('bw').classList.remove('hid');$('fl').value=B.flow;$('fv').textContent=B.flow.toFixed(1);last=performance.now();cancelAnimationFrame(raf);raf=requestAnimationFrame(loop);lastUi='';ui();draw(last)}
function closeBrew(){stopPour();view=false;pid=null;cancelAnimationFrame(raf);$('bw').classList.add('hid');if(S.ph==='brew')render()}
function startPour(){if(B.pour||B.water>=260)return;if(B.stage===1&&B.bloomAt!==null&&B.t-B.bloomAt<BLOOM-5)B.early=true;B.started=true;B.pour=true;ui()}
function stopPour(){if(!B.pour)return;B.pour=false;
 let first=true;   // tahap dikonfirmasi saat berhenti; overshoot dihitung sekali pada target pertama yang terlewati
 while(B.stage<4&&B.water>=T[B.stage]-1){if(first){B.over+=Math.min(20,Math.max(0,B.water-T[B.stage]-3));first=false}if(B.stage===0)B.bloomAt=B.t;B.stage++}
 ui()}
function togglePour(){B.pour?stopPour():startPour()}
function again(){stopPour();resetBrew();$('fl').value=B.flow;$('fv').textContent=B.flow.toFixed(1);lastUi='';ui();draw(performance.now())}

function loop(ts){
 if(!view)return;
 const dt=cl((ts-last)/1000,0,.1);last=ts;
 if(B.started)B.t+=dt;
 const k=1-Math.exp(-dt*(reduce?60:16)),ox=B.kx;       // kettle mengikuti pointer dengan halus
 B.kx+=(B.tx-B.kx)*k;B.ky+=(B.ty-B.ky)*k;
 B.vx+=((B.kx-ox)/Math.max(dt,.001)-B.vx)*.2;
 if(B.kx>106)B.fx=-1;else if(B.kx<94)B.fx=1;
 const dx=B.kx-C.x,dy=B.ky-C.y,inside=Math.hypot(dx,dy)<=R_IN;
 if(B.pour){
  const a=B.flow*dt;
  if(inside){   // hanya air yang jatuh di dalam dripper yang masuk timbangan
   B.water+=a;B.zone[Math.hypot(dx,dy)<6?0:dx>=0?(dy>=0?1:2):(dy>=0?3:4)]+=dt;
   for(let i=0;i<NC;i++){const ex=CELLS[i][0]+2-B.kx,ey=CELLS[i][1]+2-B.ky,q=ex*ex+ey*ey;if(q<64)B.cells[i]=Math.min(1,B.cells[i]+a*.14*(1-Math.sqrt(q)/8))}
  }else{B.spill+=a;B.spillT+=dt;spillAt(B.kx,B.ky,a)}
  if(B.flow>9)B.harsh+=dt;
  if(B.water>=260){B.water=260;stopPour()}
 }
 const kd=.08+.02*S.grind,pl=B.water-B.dr;               // drawdown: gilingan lebih halus = lebih lambat
 B.dr=pl<.05?B.water:B.dr+pl*Math.min(1,dt*kd);
 draw(ts);ui();
 raf=requestAnimationFrame(loop);
}
function draw(ts){
 const pn=ts/1000,dtd=cl((ts-(B.pt||ts))/1000,0,.1);B.pt=ts;
 const f=B.flow,lx=B.kx,ly=B.ky,ky=ly-LIFT,on=Math.hypot(lx-C.x,ly-C.y)<=R_IN,pool=B.water-B.dr;
 const at=(e,o)=>{for(const n in o)e.setAttribute(n,o[n])};
 V.sc.textContent=B.water.toFixed(1)+' g';
 const tgt=T[Math.min(B.stage,3)];V.tg.textContent='→ '+tgt+' g';V.tp.setAttribute('width',(58*cl(B.water/tgt,0,1)).toFixed(1));
 V.kt.setAttribute('transform',`translate(${lx.toFixed(1)},${ky.toFixed(1)}) scale(${B.fx},1)`);
 V.ksh.setAttribute('transform',`translate(${(lx+3).toFixed(1)},${(ly+2).toFixed(1)}) scale(${B.fx},1)`);
 at(V.ret,{cx:lx.toFixed(1),cy:ly.toFixed(1),stroke:on?'#f0b24a':'#c2412d'});V.ret.style.display=B.pour?'none':'';
 // aliran air: keluar dari ujung spout, melengkung mengikuti gerak kettle, berakhir di titik jatuh
 const sw=cl(-B.vx*.03,-5,5),w=1+f*.28,p=B.pour?'':'none';
 V.st.style.display=p;V.st2.style.display=p;V.imp.style.display=p;
 if(B.pour){
  const dd=`M${lx.toFixed(1)},${(ky+.5).toFixed(1)} Q${(lx+sw).toFixed(1)},${(ky+LIFT/2).toFixed(1)} ${lx.toFixed(1)},${ly.toFixed(1)}`;
  at(V.st,{d:dd,'stroke-width':w.toFixed(2),stroke:f>9?'#e6f6ff':'#7db8e0','stroke-dasharray':f<2.5?'2 2':'none'});
  at(V.st2,{d:dd,'stroke-width':Math.max(.5,w*.35).toFixed(2),'stroke-dashoffset':reduce?0:(-pn*40).toFixed(1)});
  at(V.imp,{cx:lx.toFixed(1),cy:ly.toFixed(1),r:(1.5+f*.2+(reduce?0:Math.sin(pn*30)*.3)).toFixed(2),fill:on?'#cfe9ff':'#9fd6ff'});
 }
 const spl=B.pour&&(!on||f>9);
 V.spw.forEach((e,i)=>{e.style.display=spl?'':'none';if(spl)at(e,{x:(lx+(i-1.5)*3+Math.sin(pn*20+i)*1.5).toFixed(1),y:(ly-1-Math.abs(Math.sin(pn*13+i))*3).toFixed(1)})});
 const ph=(pn*1.6)%1;                                    // riak di titik jatuh (hanya saat air masuk)
 [V.rp1,V.rp2].forEach((e,i)=>{const q=(ph+i*.5)%1,sh=B.pour&&on;e.style.display=sh?'':'none';if(sh)at(e,{cx:lx.toFixed(1),cy:ly.toFixed(1),r:(reduce?5+i*4:2+q*10).toFixed(1),opacity:(reduce?.6:(1-q)*.8).toFixed(2),'stroke-width':f>9?1.6:.9})});
 // permukaan kopi: kering > basah setempat > bloom (mengembang + gelembung) > genangan > drawdown (padat, kawah)
 const bi=(B.water>6&&B.stage<=1&&!(B.bloomAt!==null&&B.t-B.bloomAt>=30))?Math.min(1,B.water/40)*(B.bloomAt!==null?Math.max(0,1-(B.t-B.bloomAt)/30):1):0;
 V.bedc.setAttribute('r',(17+1.4*bi).toFixed(2));V.dome.setAttribute('opacity',(bi*.35).toFixed(2));
 V.wl.setAttribute('opacity',cl(pool/25,0,.5).toFixed(2));
 V.crt.setAttribute('opacity',(!B.pour&&B.water>60&&pool<2)?.55:0);
 const pw=cl(pool/10,0,1)*.9,dm=Math.min(.6,B.water/150);
 for(let i=0;i<NC;i++){const v=Math.max(B.cells[i],pw,dm);if(Math.abs(v-B.lw[i])>.03){B.lw[i]=v;V.cells[i].setAttribute('opacity',(v*.8).toFixed(2))}}
 if(bi>0&&Math.random()<dtd*10*bi){const j=B.bub.indexOf(null);if(j>=0){const a=Math.random()*6.28,rr=Math.sqrt(Math.random())*14;B.bub[j]={x:C.x+Math.cos(a)*rr,y:C.y+Math.sin(a)*rr,a:0,l:1.2+Math.random()*1.6,r:.8+Math.random()*2.2}}}
 B.bub.forEach((b,j)=>{if(!b)return;const e=V.bub[j];b.a+=dtd;const q=b.a/b.l;if(q>=1){B.bub[j]=null;e.setAttribute('opacity',0);return}at(e,{cx:b.x.toFixed(1),cy:b.y.toFixed(1),r:(.4+b.r*Math.sin(q*Math.PI)).toFixed(2),opacity:.9})});
 // server: cincin kopi, level, tetesan
 V.cf.setAttribute('opacity',(B.dr/260*.8).toFixed(2));
 const lh=30*B.dr/260,lv=96-lh;at(V.cf2,{y:lv.toFixed(1),height:lh.toFixed(1)});
 const dro=pool>.4&&lv>56;V.dp.forEach((e,i)=>{e.style.display=dro?'':'none';if(dro)e.setAttribute('y',(53+((pn*40+i*9)%(lv-53))).toFixed(1))});
 at(V.fm,{y:(56*(1-(cl(f,1,12)-1)/11)-1).toFixed(1),fill:(f>9||f<2.5)?'#c2412d':'#8be08b'});
 V.alr.setAttribute('opacity',B.pour&&(!on||f>9.5)?(.5+.4*Math.sin(pn*14)).toFixed(2):0);
 V.pd.forEach((e,i)=>{const q=B.pud[i];e.style.display=q?'':'none';if(q)at(e,{cx:q.x.toFixed(1),cy:q.y.toFixed(1),rx:q.r.toFixed(1),ry:(q.r*.7).toFixed(1)})});
 V.sts.textContent=status(on,pool);
}
function ui(){
 $('pb').textContent=B.pour?'Berhenti':'Mulai tuang';
 $('pb').classList.toggle('s',B.pour);
 $('fin').disabled=B.water<20||B.pour;
 const on=Math.hypot(B.kx-C.x,B.ky-C.y)<=R_IN,pool=B.water-B.dr,w=B.bloomAt!==null&&B.stage===1?BLOOM-(B.t-B.bloomAt):0;
 let h=B.pour?(!on?'Meleset! Air tumpah, tidak masuk timbangan.':B.flow>9?'Terlalu deras!':B.flow<2.5?'Terlalu pelan.':''):'';
 if(!h){
  if(!B.started)h='Seret di layar untuk menggeser kettle ke atas bed kopi, lalu tekan Mulai tuang.';
  else if(B.stage<4&&B.pour&&B.water>=T[B.stage])h=`Target ${T[B.stage]} g tercapai. Tekan Berhenti.`;
  else if(w>0)h=`Tunggu bloom selesai (${Math.ceil(w)} dtk).`;
  else if(B.stage<4)h=`Tuang perlahan hingga ${T[B.stage]} g.`;
  else h=pool>.4?'Drawdown: tunggu air turun.':'Semua target tercapai. Tekan Selesai seduh.'}
 const chips=T.map((g,i)=>`<span class="chip ${i<B.stage?'done':i===B.stage?'cur':''}">${i<B.stage?'✓ ':''}${g} g</span>`).join('');
 const st=status(on,pool),k=chips+st+h+(B.spill>1?B.spill.toFixed(0):'');
 if(k!==lastUi){lastUi=k;$('stg').innerHTML=chips+'<br><b>'+st+'</b> · '+h+(B.spill>1?`<br>Tumpah: ${B.spill.toFixed(0)} g`:'')}
}
// Kettle: seret dengan Pointer Events. Posisi relatif terhadap titik sentuh awal, jadi kettle tidak melompat.
const bs=$('bs');let pid=null,po={x:0,y:0};
function svgPt(e){const p=bs.createSVGPoint();p.x=e.clientX;p.y=e.clientY;const m=bs.getScreenCTM();return m?p.matrixTransform(m.inverse()):{x:C.x,y:C.y}}
bs.onpointerdown=e=>{if(pid!==null||!view)return;const p=svgPt(e);pid=e.pointerId;po={x:B.tx-p.x,y:B.ty-p.y};try{bs.setPointerCapture(pid)}catch(x){}};
bs.onpointermove=e=>{if(e.pointerId!==pid)return;const p=svgPt(e);B.tx=cl(p.x+po.x,8,152);B.ty=cl(p.y+po.y,10,120)};
const relP=e=>{if(e.pointerId===pid){try{bs.releasePointerCapture(pid)}catch(x){}pid=null}};
bs.onpointerup=bs.onpointercancel=bs.onlostpointercapture=relP;
document.addEventListener('visibilitychange',()=>{if(document.hidden&&view)stopPour()});

// ===== Penilaian =====
function finishBrew(){
 if(B.water<20)return;
 stopPour();
 const bn=BEANS[S.bean],kd=.08+.02*S.grind,pl=B.water-B.dr;
 const total=B.t+(pl>.3?Math.log(pl/.3)/kd:0),ratio=B.water/S.grams;   // sisa drawdown ikut dihitung
 const zs=B.zone,zt=zs[0]+zs[1]+zs[2]+zs[3]+zs[4],ide=[.12,.22,.22,.22,.22];
 const D=zt>2?zs.reduce((a,v,i)=>a+Math.abs(v/zt-ide[i]),0)/2:0;       // 0 = air merata
 const sc={
  ratio:cl(100-Math.abs(ratio-15)*18),
  grind:cl(100-Math.abs(S.grind-bn.g)*16),
  temp:cl(100-Math.abs(S.temp-bn.t)*7),
  time:cl(100-(total<100?100-total:total>190?total-190:0)*.9),
  cons:cl(100-Math.min(30,B.spillT*10)-Math.min(24,B.over*1.2)-Math.min(15,B.harsh*4)-(B.early?8:0)-Math.min(18,D*30))};
 const score=sc.ratio*.2+sc.grind*.25+sc.temp*.15+sc.time*.15+sc.cons*.25;
 const x=(S.grind-bn.g)+(bn.t-S.temp)/3+(total<100?2:total>190?-2:0);
 const taste=x>1.5?'cenderung asam dan tipis':x<-1.5?'cenderung pahit dan kering':'cukup seimbang';
 S.res={sc,score,ratio,total,taste};
 closeBrew();go('result');
}
function serve(){
 const Rr=S.res,n=cl(Math.round(Rr.score/20),1,5);
 S.stars=n;S.d=n>=4?2:n===3?1:-1;S.earn=10000+Math.round(Rr.score)*300;
 save.money+=S.earn;save.rep=Math.max(0,save.rep+S.d);save.served++;persist();
 S.mood=n>=4?1:n===3?0:2;S.comment=CM[n-1];
 setCs('take');go('served');
}

buildScene();buildBrew();newOrder();render();requestAnimationFrame(sceneLoop);
</script>
